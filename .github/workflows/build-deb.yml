name: Build and Release .deb Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the .deb to (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb package
        run: bash packaging/deb/build.sh

      - name: Verify .deb
        run: |
          ls -lh gum_*.deb
          dpkg-deb --info gum_*.deb

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" gum_*.deb --clobber -R ${{ github.repository }}
